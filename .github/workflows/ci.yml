name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # The ast extra (tree-sitter) is small and gives mypy real Node types;
      # the ml extra (torch) stays out to keep CI light — mypy ignores the
      # missing sentence_transformers via an override in pyproject.toml.
      - name: Install dependencies
        run: uv sync --extra ast

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff, mdformat, taplo, yamlfix)
        run: make fmt-check

      - name: Spelling (codespell)
        run: uv run codespell

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Tests + coverage (pytest-cov, fail under 90%)
        run: uv run pytest --cov --cov-report=term-missing

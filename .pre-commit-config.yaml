# See https://pre-commit.com for more information.
# Run against all files: `uv run pre-commit run --all-files`.
repos:
  # Kept equal to the floor in pyproject's dev dependencies on purpose.
  # They drifted — the hook pinned 0.6.9 while the project required
  # >=0.16 — and two formatters with different ideas about the same file
  # rewrite each other's work: `poe fmt` reflowed an assert message, the
  # hook put it back, and every commit touching that file did it again.
  # CI lints with the project's ruff, so the hook was also the weaker of
  # the two checks.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      # `ruff-check` rather than `ruff`: the latter still works and
      # announces itself as a legacy alias every run.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: taplo
        name: taplo
        entry: uv run taplo fmt --check
        language: system
        types: [toml]
      - id: yamlfix
        name: yamlfix
        entry: uv run yamlfix --check
        language: system
        types: [yaml]
      - id: mdformat
        name: mdformat
        entry: uv run mdformat --check
        language: system
        types: [markdown]
      - id: codespell
        name: codespell
        entry: uv run codespell
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run mypy src tests
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest --cov --cov-report=term-missing
        language: system
        types: [python]
        pass_filenames: false

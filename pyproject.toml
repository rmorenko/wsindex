[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wsindex"
# The version lives in src/wsindex/__init__.py (__version__); hatchling
# extracts it at build time — single source of truth.
dynamic = ["version"]
description = "WSIndex — a learning CLI that indexes a developer workspace for semantic code and doc search."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "WSIndex contributors" }]
keywords = ["rag", "indexing", "search", "cli", "embeddings"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Typing :: Typed",
]
# No runtime dependencies yet: this is the toolchain skeleton. The real engine
# (typer, httpx, numpy, tree-sitter, sentence-transformers) is added as the
# package described in ARCH_en.md is implemented.
dependencies = ["numpy>=2.4,<3", "tomli-w>=1.2,<2", "typer>=0.27,<1"]

[project.scripts]
wsindex = "wsindex.cli:app"

[project.optional-dependencies]
ml = ["sentence-transformers>=5.7,<6"]
ast = [
  "tree-sitter>=0.26,<1",
  "tree-sitter-dockerfile>=0.2,<1",
  "tree-sitter-json>=0.24,<1",
  "tree-sitter-python>=0.25,<1",
  "tree-sitter-toml>=0.7,<1",
  "tree-sitter-yaml>=0.7,<1",
]

[dependency-groups]
dev = [
  "ruff>=0.16,<1",
  "mypy>=2.3,<3",
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "pre-commit>=4.6,<5",
  "mdformat>=1.0,<2",
  "mdformat-gfm>=1.0,<2",
  "codespell>=2.4,<3",
  "taplo>=0.9,<1",
  "yamlfix>=1.19,<2",
]

[tool.uv]
# pathspec 1.1.1 is broken: `agg.py` imports `re2_error` from `re2/base.py`,
# where the name is only annotated, never assigned (it lives in `re2/_base.py`).
# Keep it out of hatchling's isolated build env until a fixed release lands.
build-constraint-dependencies = ["pathspec!=1.1.1"]

[tool.hatch.version]
path = "src/wsindex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wsindex"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# 3.12, not 3.11: numpy >=2.4 stubs use PEP 695 `type` aliases, and mypy
# feature-gates that syntax by python_version even in stub files. Runtime
# 3.11 compatibility is still covered by the pytest jobs in the CI matrix.
python_version = "3.12"
strict = true
warn_unused_ignores = true

[tool.codespell]
skip = ".git,.venv,uv.lock,.mypy_cache,.ruff_cache,.pytest_cache,.claude,htmlcov,build,dist"

[tool.yamlfix]
line_length = 100
# Keep diffs minimal: no forced `---` document start, no flow/block rewriting,
# blank separator lines allowed.
explicit_start = false
sequence_style = "keep_style"
whitelines = 1

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs network and a real model download"]
addopts = "-m 'not slow'"

[tool.coverage.run]
source = ["wsindex"]

[tool.coverage.report]
fail_under = 90
show_missing = true

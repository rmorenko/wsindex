[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wsindex"
version = "0.1.0"
description = "WSIndex — a learning CLI that indexes a developer workspace for semantic code and doc search."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "WSIndex contributors" }]
keywords = ["rag", "indexing", "search", "cli", "embeddings"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Typing :: Typed",
]
# No runtime dependencies yet: this is the toolchain skeleton. The real engine
# (typer, httpx, numpy, tree-sitter, sentence-transformers) is added as the
# package described in ARCH_en.md is implemented.
dependencies = []

[project.scripts]
wsindex = "wsindex:main"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-cov>=5",
    "pre-commit>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wsindex"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["wsindex"]

services:
  app:
    build:
      context: https://github.com/tensorus/tensorus.git
      # Upstream Dockerfile fails under BuildKit (inline comments after ENV),
      # so we define an equivalent image here.
      dockerfile_inline: |
        FROM python:3.11-slim
        ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        # psutil is imported by tensorus but missing from upstream requirements.txt
        RUN pip install --no-cache-dir psutil
        # Server-side embedding (wsindex plan step 16, option B): upstream
        # ships the vector API without any embedding provider installed.
        RUN pip install --no-cache-dir sentence-transformers
        COPY tensorus ./tensorus
        # Upstream bug: api/__init__.py execs api.py under the name
        # "tensorus.api_app" but never registers it in sys.modules, so the
        # dependencies.py patch below finds nothing there and every agent
        # ends up with its own TensorStorage. Register it, as the import
        # protocol requires (module goes into sys.modules before exec).
        RUN sed -i 's/^_api = importlib.util.module_from_spec(_spec)$/import sys\n_api = importlib.util.module_from_spec(_spec)\nsys.modules["tensorus.api_app"] = _api/' tensorus/api/__init__.py
        # Upstream bug: /query builds its own TensorStorage, so NQL never sees
        # datasets created via the CRUD endpoints (which live on the instance
        # in api.py, loaded as tensorus.api_app). Reuse that shared instance.
        RUN cat >> tensorus/api/dependencies.py <<'PY'

        def get_tensor_storage() -> TensorStorage:
            global _tensor_storage_instance
            if _tensor_storage_instance is None:
                import sys
                _app_mod = sys.modules.get("tensorus.api_app")
                _shared = getattr(_app_mod, "tensor_storage_instance", None)
                _tensor_storage_instance = _shared if _shared is not None else TensorStorage()
            return _tensor_storage_instance
        PY
        # FastAPI's default /docs and /redoc pull Swagger/ReDoc assets from
        # cdn.jsdelivr.net, which is unreachable from some networks (blank
        # page in the browser). Bundle the assets into the image and serve
        # them locally instead.
        RUN mkdir -p static && python - <<'PY'
        import urllib.request
        for url, dst in [
            ("https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js", "static/swagger-ui-bundle.js"),
            ("https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css", "static/swagger-ui.css"),
            ("https://cdn.jsdelivr.net/npm/redoc@2/bundles/redoc.standalone.js", "static/redoc.standalone.js"),
        ]:
            urllib.request.urlretrieve(url, dst)
        PY
        RUN cat > docs_local.py <<'PY'
        from fastapi.openapi.docs import get_redoc_html, get_swagger_ui_html
        from fastapi.staticfiles import StaticFiles

        from tensorus.api import app

        app.mount("/static", StaticFiles(directory="static"), name="static")
        app.router.routes = [
            r for r in app.router.routes
            if getattr(r, "path", None) not in ("/docs", "/redoc")
        ]

        @app.get("/docs", include_in_schema=False)
        async def swagger_ui_html():
            return get_swagger_ui_html(
                openapi_url=app.openapi_url,
                title=f"{app.title} - Swagger UI",
                swagger_js_url="/static/swagger-ui-bundle.js",
                swagger_css_url="/static/swagger-ui.css",
            )

        @app.get("/redoc", include_in_schema=False)
        async def redoc_html():
            return get_redoc_html(
                openapi_url=app.openapi_url,
                title=f"{app.title} - ReDoc",
                redoc_js_url="/static/redoc.standalone.js",
            )

        # Tensorus sets "Content-Security-Policy: default-src 'self'", which
        # blocks the inline bootstrap scripts of Swagger UI / ReDoc (blank
        # page), and X-Frame-Options: SAMEORIGIN, which blocks the iframes on
        # the UI's API Playground page. Relax both for the docs routes only.
        _DOCS_PATHS = ("/docs", "/redoc", "/openapi.json", "/static/")

        @app.middleware("http")
        async def _relax_docs_csp(request, call_next):
            response = await call_next(request)
            if request.url.path.startswith(_DOCS_PATHS):
                response.headers["content-security-policy"] = (
                    "default-src 'self'; "
                    "script-src 'self' 'unsafe-inline'; "
                    "style-src 'self' 'unsafe-inline'; "
                    "img-src 'self' data: https:; "
                    "worker-src 'self' blob:; "
                    "frame-ancestors *"
                )
                if "x-frame-options" in response.headers:
                    del response.headers["x-frame-options"]
            return response
        PY
        EXPOSE 7860
        CMD ["uvicorn", "docs_local:app", "--host", "0.0.0.0", "--port", "7860"]
    container_name: tensorus_app
    ports:
      - 8000:7860
    environment:
      - PYTHONUNBUFFERED=1
      - TENSORUS_STORAGE_BACKEND=postgres
      - TENSORUS_POSTGRES_HOST=db
      - TENSORUS_POSTGRES_PORT=5432
      - TENSORUS_POSTGRES_USER=${POSTGRES_USER:-tensorus_admin}
      - TENSORUS_POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - TENSORUS_POSTGRES_DB=${POSTGRES_DB:-tensorus_db}
      - TENSORUS_VALID_API_KEYS=${TENSORUS_API_KEYS}
      - TENSORUS_AUTH_JWT_ENABLED=False
    volumes:
      # TensorStorage persists datasets as .pt files here; postgres only
      # holds tensor-descriptor metadata (upstream design)
      - tensor_data:/app/tensor_data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: https://github.com/tensorus/tensorus.git
      dockerfile_inline: |
        FROM python:3.11-slim
        ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        RUN pip install --no-cache-dir psutil
        COPY tensorus ./tensorus
        COPY app.py .
        COPY pages ./pages
        # Upstream bug: 4_Data_Explorer.py uses np.number without importing
        # numpy (same genre as the missing logging/typing in api_client.py).
        RUN sed -i '1i import numpy as np' pages/4_Data_Explorer.py
        # Upstream UI targets an older API: stale endpoint paths, old response
        # shapes, and no API-key auth. Redefine the accessors and inject
        # X-API-KEY into every request.
        # Streamlit lists every .py in pages/ as a sidebar page, so the
        # utility modules there render as blank pages; move them to the app
        # root. This also fixes upstream's relative imports, which crash
        # because Streamlit runs page files as top-level scripts.
        RUN mv pages/api_client.py pages/pages_shared_utils.py pages/ui_utils.py . \
         && sed -i 's/from pages\.api_client/from api_client/; s/from \.api_client/from api_client/; s/from pages\.pages_shared_utils/from pages_shared_utils/' app.py pages/*.py
        # Swagger/ReDoc links and iframes open in the user's browser, which
        # cannot resolve the internal hostname in API_BASE_URL; use the
        # host-published URL for those instead.
        RUN sed -i '/^swagger_url = /i import os\nPUBLIC_API_URL = os.getenv("TENSORUS_PUBLIC_API_URL", API_BASE_URL)' pages/api_playground_v2.py \
         && sed -i 's|{API_BASE_URL}/docs|{PUBLIC_API_URL}/docs|; s|{API_BASE_URL}/redoc|{PUBLIC_API_URL}/redoc|' pages/api_playground_v2.py
        # Streamlit auto-closes the unclosed <div> from st.markdown, so the
        # "iframe-container" wrapper renders as an empty 800px box above the
        # real iframe. Drop the wrapper markdown calls.
        RUN sed -i '/<div class="iframe-container">/d; /st.markdown(.<\/div>./d' pages/api_playground_v2.py
        # api_client.py uses logging and typing names without importing them
        RUN sed -i '1i import logging\nfrom typing import Any, Dict, List, Optional' api_client.py
        # Streamlit runs each page standalone (app.py is not executed first),
        # so the X-API-KEY patch must load from every entrypoint module.
        RUN cat > api_auth.py <<'PY'
        import os
        import requests
        _api_key = os.getenv("TENSORUS_API_KEY", "").split(",")[0].strip()
        if _api_key:
            _orig_request = requests.sessions.Session.request
            def _keyed_request(self, method, url, **kwargs):
                headers = kwargs.get("headers") or {}
                headers.setdefault("X-API-KEY", _api_key)
                kwargs["headers"] = headers
                return _orig_request(self, method, url, **kwargs)
            requests.sessions.Session.request = _keyed_request
        PY
        RUN sed -i '1i import api_auth' api_client.py
        RUN cat >> pages_shared_utils.py <<'PY'

        # --- Compatibility patch for the current API (see Dockerfile) ---
        import api_auth

        def get_agent_status():
            try:
                r = requests.get(f"{API_BASE_URL}/agents", timeout=5)
                r.raise_for_status()
                return {a["id"]: a for a in r.json()}
            except Exception as e:
                logger.error(f"API error fetching agent status: {e}")
                return None

        def get_datasets():
            try:
                r = requests.get(f"{API_BASE_URL}/datasets", timeout=5)
                r.raise_for_status()
                return r.json().get("data", [])
            except Exception as e:
                logger.error(f"API error fetching datasets: {e}")
                return []

        def get_dataset_preview(dataset_name, limit=10):
            try:
                r = requests.get(f"{API_BASE_URL}/datasets/{dataset_name}/records",
                                 params={"offset": 0, "limit": limit}, timeout=10)
                r.raise_for_status()
                records = r.json().get("data", [])
                for rec in records:
                    rec.setdefault("id", rec.get("record_id"))
                try:
                    c = requests.get(f"{API_BASE_URL}/datasets/{dataset_name}/count", timeout=5)
                    c.raise_for_status()
                    count = c.json().get("data", {}).get("count", len(records))
                except Exception:
                    count = len(records)
                return {"dataset": dataset_name, "record_count": count, "preview": records}
            except Exception as e:
                logger.error(f"API error fetching dataset preview: {e}")
                return None

        def post_nql_query(query):
            try:
                r = requests.post(f"{API_BASE_URL}/query", json={"query": query}, timeout=15)
                r.raise_for_status()
                data = r.json()
                data.setdefault("response_text", data.get("message"))
                return data
            except requests.exceptions.HTTPError as e:
                try:
                    detail = e.response.json().get("detail", str(e))
                except Exception:
                    detail = str(e)
                return {"query": query, "response_text": detail, "error": str(e), "results": None}
            except Exception as e:
                return {"query": query, "response_text": "Error connecting to backend.", "error": str(e), "results": None}
        PY
        EXPOSE 8501
        CMD ["streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    container_name: tensorus_ui
    ports:
      - 8501:8501
    environment:
      - API_BASE_URL=http://app:7860
      # pages/api_client.py reads the URL from tensorus settings, not API_BASE_URL
      - TENSORUS_API_BASE_URL=http://app:7860
      # Browser-facing URL for Swagger/ReDoc links (host port of the app service)
      - TENSORUS_PUBLIC_API_URL=http://localhost:8000
      - TENSORUS_API_KEY=${TENSORUS_API_KEYS}
    depends_on:
      - app
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tensorus_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
      - PGADMIN_SERVER_JSON_FILE=/var/lib/pgadmin/servers.json
      - POSTGRES_USER=${POSTGRES_USER:-tensorus_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-tensorus_db}
    entrypoint: [/bin/sh, /custom-entrypoint.sh]
    ports:
      - 5050:80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/entrypoint.sh:/custom-entrypoint.sh:ro
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: tensorus_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-tensorus_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-tensorus_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 5432:5432
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${POSTGRES_USER:-tensorus_admin} -d ${POSTGRES_DB:-tensorus_db}']
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  pgadmin_data:
  tensor_data:

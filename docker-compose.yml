services:
  app:
    image: tensorus/core:latest  # Or build: . if building locally
    container_name: tensorus_app
    ports:
      - "8000:8000"
    environment:
      - TENSORUS_AUTH_ENABLED=true
      - TENSORUS_API_KEYS=${TENSORUS_API_KEYS}
      - TENSORUS_STORAGE_BACKEND=postgres
      - POSTGRES_USER=${POSTGRES_USER:-tensorus_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-tensorus_db}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: tensorus_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-tensorus_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-tensorus_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tensorus_admin} -d ${POSTGRES_DB:-tensorus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:

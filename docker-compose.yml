services:
  app:
    build:
      context: https://github.com/tensorus/tensorus.git
      # Upstream Dockerfile fails under BuildKit (inline comments after ENV),
      # so we define an equivalent image here.
      dockerfile_inline: |
        FROM python:3.11-slim
        ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        # psutil is imported by tensorus but missing from upstream requirements.txt
        RUN pip install --no-cache-dir psutil
        COPY tensorus ./tensorus
        EXPOSE 7860
        CMD ["uvicorn", "tensorus.api:app", "--host", "0.0.0.0", "--port", "7860"]
    container_name: tensorus_app
    ports:
      - "8000:7860"
    environment:
      - PYTHONUNBUFFERED=1
      - TENSORUS_STORAGE_BACKEND=postgres
      - TENSORUS_POSTGRES_HOST=db
      - TENSORUS_POSTGRES_PORT=5432
      - TENSORUS_POSTGRES_USER=${POSTGRES_USER:-tensorus_admin}
      - TENSORUS_POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - TENSORUS_POSTGRES_DB=${POSTGRES_DB:-tensorus_db}
      - TENSORUS_VALID_API_KEYS=${TENSORUS_API_KEYS}
      - TENSORUS_AUTH_JWT_ENABLED=False
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: https://github.com/tensorus/tensorus.git
      dockerfile_inline: |
        FROM python:3.11-slim
        ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        RUN pip install --no-cache-dir psutil
        COPY tensorus ./tensorus
        COPY app.py .
        COPY pages ./pages
        EXPOSE 8501
        CMD ["streamlit", "run", "app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    container_name: tensorus_ui
    ports:
      - "8501:8501"
    environment:
      - API_BASE_URL=http://app:7860
    depends_on:
      - app
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tensorus_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: tensorus_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-tensorus_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=${POSTGRES_DB:-tensorus_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tensorus_admin} -d ${POSTGRES_DB:-tensorus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  pgadmin_data:

services:
  # S3-compatible storage for the LanceDB shared-index scenario
  # (wsindex plan step 17d): the acceptance run exercises the local
  # backend against s3://wsindex/... through this server.
  minio:
    image: quay.io/minio/minio:latest
    container_name: wsindex_minio
    command: server /data --console-address ":9001"
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot bucket bootstrap: LanceDB does not create buckets, and the
  # acceptance must be reproducible without manual console clicks.
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: wsindex_minio_init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        && mc mb --ignore-existing local/wsindex

volumes:
  minio_data:
